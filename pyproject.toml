[project]
name = "ontology-lib"
version = "0.1.0"
description = "Load and validate MetaReasoning domain ontologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0.0",
  "pyyaml>=6.0",
  "semantica>=0.6.5",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
store = [
  "semantica[tripletstore-oxigraph]>=0.6.5",
]
regulatory = [
  "ontology-lib[store]",
  "semantica[llm-anthropic]>=0.6.5",
  "anthropic>=0.40.0",
]
dev = [
  "pytest>=8.0.0",
  "ontology-lib[store]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
