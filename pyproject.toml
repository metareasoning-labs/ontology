[project]
name = "ontology-lib"
version = "0.1.0"
description = "Load and validate MetaReasoning domain ontologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rdflib>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
